; Configurazione di pytest.
;
; Fino al 2026-08-23 il progetto non aveva nessun file di configurazione, e la
; suite chiudeva con quattro avvisi. Tre erano `PytestUnknownMarkWarning`: i
; marcatori `slow` e `opcua` erano usati nel codice ma non dichiarati da
; nessuna parte, quindi pytest sospettava un errore di battitura.
;
; Dichiararli qui non cambia quali test vengono raccolti né come vengono
; eseguiti: serve solo a distinguere un marcatore voluto da uno sbagliato.
; Verificato prima e dopo: 567 test raccolti, 567 passati.
;
; Il quarto avviso resta e non si toglie da qui. È uno
; `StarletteDeprecationWarning` che nasce dentro `fastapi/testclient.py`, cioè
; in una libreria: per farlo sparire bisogna installare `httpx2`, cioè
; modificare l'ambiente Python — e il 2026-08-22 è stato deciso di non toccarlo.
; Nascondere quell'avviso con un filtro sarebbe peggio che tenerlo: è l'unico
; segnale rimasto di una dipendenza che invecchia.

[pytest]
markers =
    slow: test lento, escluso dalle corse rapide con `-m "not slow"`
    opcua: richiede un server OPC UA raggiungibile
