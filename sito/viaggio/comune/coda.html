<script>
(function(){
  "use strict";

  /* ---------- interruttore del tema ---------- */
  var btn = document.getElementById('tema');
  function scuroOra(){
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function etichetta(){ btn.textContent = scuroOra() ? 'CHIARO' : 'SCURO'; }
  btn.addEventListener('click', function(){
    document.documentElement.setAttribute('data-theme', scuroOra() ? 'light' : 'dark');
    etichetta(); disegna();
  });
  etichetta();

  var svg = document.getElementById('scena');
  var piede = document.getElementById('scena-dato');
  var fermo = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stato = 0, ang = 0;

  var F = 'font-family="Segoe UI, system-ui, sans-serif"';

  /* ---------- le dieci scene ----------
     Sempre lo stesso dato, il ciclo 417 della valvola 29, che cambia forma. */

  function giostra(evidenzia){
    var cx=210, cy=150, R=104, h='';
    h += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+16)+'" fill="var(--sup-2)" stroke="var(--bordo)"></circle>';
    for (var j=0;j<35;j++){
      var a = ang + j*2*Math.PI/35;
      var x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
      var norm = ((a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      var morta = (norm > 5.24 || norm < 0.56);
      var sta = evidenzia && (Math.abs(norm - 3.14) < 0.2);
      h += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(sta?8:5)+
           '" fill="'+(sta?'var(--attenz)':(morta?'var(--banda)':'var(--dato)'))+'"></circle>';
    }
    h += '<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="var(--sup)" stroke="var(--bordo)"></circle>';
    h += '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="14" '+F+' fill="var(--muto)">35</text>';
    h += '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">un giro in 3,2 secondi</text>';
    h += '<text x="16" y="290" font-size="12" '+F+' fill="var(--muto)">in grigio chiaro le 9 posizioni che non riempiono</text>';
    return h;
  }

  function valvola(quanto){
    var h = '';
    /* Il serbatoio era largo 140 e la sua etichetta 192: il testo usciva da
       tutti e due i lati. Un serbatoio in pressione e' piu' largo del rubinetto
       e della lattina, quindi allargarlo e' anche piu' giusto di com'era. */
    h += '<rect x="110" y="18" width="200" height="34" rx="3" fill="var(--sup-2)" stroke="var(--bordo)"></rect>';
    h += '<text x="210" y="40" text-anchor="middle" font-size="11.5" '+F+' fill="var(--muto)">il serbatoio, tenuto in pressione</text>';
    h += '<rect x="196" y="52" width="28" height="40" fill="var(--banda)"></rect>';
    h += '<rect x="182" y="92" width="56" height="20" rx="2" fill="var(--dato)"></rect>';
    h += '<text x="250" y="107" font-size="12" '+F+' fill="var(--muto)">il rubinetto</text>';
    h += '<rect x="190" y="112" width="40" height="26" fill="var(--banda)"></rect>';
    h += '<path d="M176 138 h68 v120 h-68 z" fill="var(--sup-2)" stroke="var(--bordo)"></path>';
    var hh = Math.round(112 * quanto);
    h += '<rect x="178" y="'+(256-hh)+'" width="64" height="'+hh+'" fill="var(--traccia)"></rect>';
    h += '<text x="210" y="278" text-anchor="middle" font-size="12" '+F+' fill="var(--muto)">la lattina</text>';
    h += '<circle cx="210" cy="126" r="5" fill="var(--attenz)"><animate attributeName="cy" values="60;180;60" dur="2.4s" repeatCount="indefinite"></animate></circle>';
    h += '<text x="290" y="150" font-size="26" '+F+' fill="var(--ink)" font-weight="600">'+Math.round(2505*quanto)+'</text>';
    h += '<text x="290" y="168" font-size="11.5" '+F+' fill="var(--muto)">scatti contati</text>';
    h += '<text x="290" y="188" font-size="11.5" '+F+' fill="var(--muto)">uno scatto vale 0,1 ml</text>';
    return h;
  }

  function riga(){
    var v = [['tempo','1980 ms'],['impulsi','2505'],['bersaglio','2500'],
             ['in piu','+5'],['punto del giro','25'],['esito','buono']];
    var h = '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">la riga che nasce alla fine del riempimento</text>';
    v.forEach(function(r,i){
      var x = 16 + (i%3)*136, y = 52 + Math.floor(i/3)*84;
      h += '<rect x="'+x+'" y="'+y+'" width="126" height="70" rx="2" fill="var(--sup-2)" stroke="'+
           (i===3?'var(--attenz)':'var(--bordo)')+'"></rect>';
      h += '<text x="'+(x+12)+'" y="'+(y+22)+'" font-size="10.5" '+F+' fill="var(--muto)" letter-spacing="1">'+r[0].toUpperCase()+'</text>';
      h += '<text x="'+(x+12)+'" y="'+(y+52)+'" font-size="21" '+F+' fill="var(--ink)" font-weight="600">'+r[1]+'</text>';
    });
    h += '<text x="16" y="240" font-size="12" '+F+' fill="var(--muto)">valvola 29 · ciclo 417 · 22 agosto, 10:03</text>';
    h += '<text x="16" y="262" font-size="12" '+F+' fill="var(--muto)">cinque impulsi in più del bersaglio, mezzo millilitro</text>';
    return h;
  }

  function albero(){
    var h = '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">la macchina si fa sfogliare come delle cartelle</text>';
    h += '<text x="20" y="56" font-size="14" '+F+' fill="var(--ink)" font-weight="600">Filler01</text>';
    h += '<path d="M28 64 V239" stroke="var(--banda)"></path>';
    h += '<path d="M28 81 h16 M28 109 h16 M28 137 h16 M28 235 h16" stroke="var(--banda)"></path>';
    h += '<text x="52" y="86" font-size="13" '+F+' fill="var(--dato)">Machine</text>';
    h += '<text x="52" y="114" font-size="13" '+F+' fill="var(--dato)">Valve01</text>';
    h += '<text x="52" y="142" font-size="13" '+F+' fill="var(--ink)" font-weight="600">Valve29</text>';
    h += '<path d="M66 147 V209" stroke="var(--attenz)"></path>';
    h += '<path d="M66 161 h16 M66 183 h16 M66 205 h16" stroke="var(--attenz)"></path>';
    h += '<text x="90" y="166" font-size="12.5" '+F+' fill="var(--ink)">FillingTime</text><text x="240" y="166" font-size="12.5" '+F+' fill="var(--dato)">1980</text>';
    h += '<text x="90" y="188" font-size="12.5" '+F+' fill="var(--ink)">PulseCount</text><text x="240" y="188" font-size="12.5" '+F+' fill="var(--dato)">2505</text>';
    h += '<text x="90" y="210" font-size="12.5" '+F+' fill="var(--ink)">DeltaPulse</text><text x="240" y="210" font-size="12.5" '+F+' fill="var(--dato)">-5</text>';
    h += '<text x="52" y="240" font-size="13" '+F+' fill="var(--muto)">SimulationControl</text>';
    h += '<text x="16" y="272" font-size="12" '+F+' fill="var(--muto)">567 indirizzi. DeltaPulse vale meno 5 perche conta</text>' + '<text x="16" y="288" font-size="12" '+F+' fill="var(--muto)">quanto manca al bersaglio, e qui e stato superato</text>';
    return h;
  }

  function busta(){
    var righe = ['{', '  "event_id": "409263a2-...",', '  "machine_id": "filler01",',
                 '  "cycle_id": 417,', '  "valve_id": 29,',
                 '  "data": {', '    "filling_time_ms": 1980,',
                 '    "pulse_count": 2505', '  }', '}'];
    var h = '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">la stessa riga, chiusa in una busta con un nome sopra</text>';
    h += '<rect x="16" y="38" width="388" height="216" rx="3" fill="var(--cod-f)"></rect>';
    righe.forEach(function(r,i){
      h += '<text x="30" y="'+(62+i*20)+'" font-size="12.5" font-family="JetBrains Mono, monospace" fill="var(--cod-t)">'+
           r.replace(/</g,'&lt;')+'</text>';
    });
    h += '<text x="16" y="278" font-size="12" '+F+' fill="var(--muto)">l\'identificatore in cima serve a non contarla due volte</text>';
    return h;
  }

  function broker(){
    var h = '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">la busta viene consegnata a uno smistatore</text>';
    h += '<rect x="16" y="120" width="94" height="40" rx="2" fill="var(--sup-2)" stroke="var(--bordo)"></rect>';
    h += '<text x="63" y="145" text-anchor="middle" font-size="12" '+F+' fill="var(--ink)">la macchina</text>';
    h += '<path d="M110 140 H164" stroke="var(--dato)" stroke-width="1.5"></path>';
    h += '<rect x="164" y="108" width="104" height="64" rx="2" fill="var(--sup-2)" stroke="var(--attenz)"></rect>';
    h += '<text x="216" y="132" text-anchor="middle" font-size="13" '+F+' fill="var(--ink)" font-weight="600">smistatore</text>';
    h += '<text x="216" y="150" text-anchor="middle" font-size="11" '+F+' fill="var(--muto)">un solo nome</text>';
    h += '<text x="216" y="164" text-anchor="middle" font-size="11" '+F+' fill="var(--muto)">per tutti</text>';
    h += '<path d="M268 140 H300 M300 140 V80 H340 M300 140 H340 M300 140 V200 H340" stroke="var(--dato)" stroke-width="1.5" fill="none"></path>';
    [['archivio',68],['allarmi',128],['cruscotto',188]].forEach(function(r){
      h += '<rect x="340" y="'+r[1]+'" width="72" height="26" rx="2" fill="var(--sup)" stroke="var(--bordo)"></rect>';
      h += '<text x="376" y="'+(r[1]+18)+'" text-anchor="middle" font-size="11" '+F+' fill="var(--muto)">'+r[0]+'</text>';
    });
    h += '<circle cx="120" cy="140" r="5" fill="var(--attenz)"><animate attributeName="cx" values="120;330;120" dur="4s" repeatCount="indefinite"></animate></circle>';
    h += '<text x="16" y="272" font-size="12" '+F+' fill="var(--muto)">chi consegna non sa chi legge, e viceversa</text>';
    return h;
  }

  function archivio(){
    var h = '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">i cicli si posano in cassetti, uno per giorno</text>';
    var g = ['20 ago','21 ago','22 ago'];
    g.forEach(function(n,i){
      var x = 16 + i*132;
      h += '<rect x="'+x+'" y="60" width="120" height="150" rx="3" fill="var(--sup-2)" stroke="'+
           (i===2?'var(--attenz)':'var(--bordo)')+'"></rect>';
      h += '<text x="'+(x+60)+'" y="86" text-anchor="middle" font-size="12.5" '+F+' fill="var(--ink)">'+n+'</text>';
      for (var k=0;k<7;k++){
        h += '<rect x="'+(x+14)+'" y="'+(98+k*14)+'" width="92" height="7" fill="var(--traccia)"></rect>';
      }
    });
    /* Il cassetto acceso va da 280 a 400: il suo centro e' 340, non 280. */
    h += '<text x="340" y="232" text-anchor="middle" font-size="12" '+F+' fill="var(--attenz)">18 511 righe</text>';
    h += '<text x="16" y="266" font-size="12" '+F+' fill="var(--muto)">chi cerca un giorno apre un cassetto solo</text>';
    return h;
  }

  function modello(){
    var h = '<text x="16" y="24" font-size="12" '+F+' fill="var(--muto)">il programma guarda cinquanta righe alla volta</text>';
    for (var k=0;k<10;k++){
      h += '<rect x="16" y="'+(48+k*15)+'" width="120" height="9" fill="'+(k===8?'var(--attenz)':'var(--traccia)')+'"></rect>';
    }
    h += '<text x="16" y="216" font-size="11.5" '+F+' fill="var(--muto)">50 cicli di fila</text>';
    /* I puntini di sospensione sembravano un testo tagliato. Il riquadro si
       allarga e le misure si dicono per intero, con le stesse parole del
       testo accanto: la media, quanto ballano, se stanno crescendo. */
    h += '<path d="M144 120 H182 m-8 -6 l8 6 l-8 6" stroke="var(--banda)" fill="none" stroke-width="1.5"></path>';
    h += '<rect x="186" y="84" width="116" height="72" rx="2" fill="var(--sup-2)" stroke="var(--bordo)"></rect>';
    h += '<text x="244" y="106" text-anchor="middle" font-size="13" '+F+' fill="var(--ink)">43 misure</text>';
    h += '<text x="244" y="126" text-anchor="middle" font-size="9.5" '+F+' fill="var(--muto)">media, quanto ballano,</text>';
    h += '<text x="244" y="141" text-anchor="middle" font-size="9.5" '+F+' fill="var(--muto)">se stanno crescendo</text>';
    h += '<path d="M306 120 H340 m-8 -6 l8 6 l-8 6" stroke="var(--banda)" fill="none" stroke-width="1.5"></path>';
    h += '<rect x="346" y="96" width="62" height="48" rx="2" fill="var(--sup-2)" stroke="var(--attenz)"></rect>';
    h += '<text x="377" y="118" text-anchor="middle" font-size="12.5" '+F+' fill="var(--ink)">sana</text>';
    h += '<text x="377" y="134" text-anchor="middle" font-size="11" '+F+' fill="var(--muto)">87%</text>';
    h += '<text x="16" y="262" font-size="12" '+F+' fill="var(--muto)">è un\'ipotesi, con la sua probabilità</text>';
    return h;
  }

  /* L'ultima scena e' la pagina VALVOLE, quella vera: una giostra vista in
     pianta, con la corona degli allarmi fuori e il conteggio al centro. Prima
     qui c'erano trentacinque quadratini in griglia, che la pagina vera non ha
     mai avuto: il viaggio arrivava a una schermata inventata. I nove numeri in
     allarme sono quelli veri della corsa registrata. */
  var IN_ALLARME = [8,13,14,15,16,17,18,21,30];

  function schermata(){
    var cx=110, cy=150, R=58, Ra=72, Rl=86, h='';
    h += '<text x="16" y="16" font-size="12" '+F+' fill="var(--muto)">la schermata vera: le trentacinque postazioni</text>';

    h += '<rect x="8" y="26" width="408" height="228" rx="3" fill="var(--sup-2)" stroke="var(--bordo)"></rect>';
    h += '<rect x="8" y="26" width="408" height="20" fill="var(--barra)"></rect>';
    h += '<text x="18" y="40" font-size="8" letter-spacing="0.7" '+F+' fill="var(--barra-muto)">GIOSTRA &#8212; TEMPO DI RIEMPIMENTO DELLE 35 VALVOLE</text>';

    /* il normale di ogni valvola: la circonferenza tratteggiata */
    h += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--banda)" stroke-dasharray="2 3"></circle>';

    for (var k=1;k<=35;k++){
      var a = -Math.PI/2 + (k-1)*2*Math.PI/35;
      var ca = Math.cos(a), sa = Math.sin(a);
      var all = IN_ALLARME.indexOf(k) >= 0;
      var noi = (k === 29);

      /* la candela: quanto sta dentro o fuori dal proprio normale */
      var d = all ? 7 : 2.5;
      h += '<line x1="'+(cx+(R-4)*ca).toFixed(1)+'" y1="'+(cy+(R-4)*sa).toFixed(1)+
           '" x2="'+(cx+(R+d)*ca).toFixed(1)+'" y2="'+(cy+(R+d)*sa).toFixed(1)+
           '" stroke="'+(noi?'var(--ink)':'var(--dato)')+'" stroke-width="'+(noi?3:2.4)+'"></line>';

      /* la corona esterna: un segmento acceso per ogni allarme attivo */
      var a1 = a - 0.075, a2 = a + 0.075;
      h += '<path d="M'+(cx+Ra*Math.cos(a1)).toFixed(1)+' '+(cy+Ra*Math.sin(a1)).toFixed(1)+
           ' A'+Ra+' '+Ra+' 0 0 1 '+(cx+Ra*Math.cos(a2)).toFixed(1)+' '+(cy+Ra*Math.sin(a2)).toFixed(1)+
           '" fill="none" stroke="'+(all?'var(--attenz)':'var(--banda)')+'" stroke-width="'+(all?5:3)+'"></path>';

      /* i numeri: solo quelli che l'occhio cerca davvero */
      if (all || noi){
        h += '<text x="'+(cx+Rl*ca).toFixed(1)+'" y="'+(cy+Rl*sa+3).toFixed(1)+
             '" text-anchor="middle" font-size="7.5" '+F+' fill="'+
             (noi?'var(--ink)':'var(--attenz)')+'" font-weight="600">'+k+'</text>';
      }
    }

    h += '<circle cx="'+cx+'" cy="'+cy+'" r="32" fill="var(--sup)" stroke="var(--bordo)"></circle>';
    h += '<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="6.5" letter-spacing="0.5" '+F+' fill="var(--muto)">IN ALLARME</text>';
    h += '<text x="'+cx+'" y="'+(cy+9)+'" text-anchor="middle" font-size="19" '+F+' fill="var(--ink)" font-weight="600">9</text>';
    h += '<text x="'+cx+'" y="'+(cy+21)+'" text-anchor="middle" font-size="7" '+F+' fill="var(--muto)">su 35</text>';

    /* il riquadro che si apre sulla valvola scelta: qui finisce il viaggio */
    h += '<rect x="200" y="60" width="204" height="92" rx="2" fill="var(--sup)" stroke="var(--ink)"></rect>';
    h += '<text x="212" y="76" font-size="8.5" letter-spacing="0.8" '+F+' fill="var(--muto)">RUBINETTO 29</text>';
    h += '<text x="392" y="76" text-anchor="end" font-size="8.5" '+F+' fill="var(--muto)">22 ago, 10:03</text>';
    var celle = [['DURATA','1980 ms'],['SCATTI','2505'],['GIUDIZIO','sana 87%']];
    celle.forEach(function(c,i){
      var x = 212 + i*62;
      h += '<text x="'+x+'" y="99" font-size="7" letter-spacing="0.5" '+F+' fill="var(--muto)">'+c[0]+'</text>';
      h += '<text x="'+x+'" y="117" font-size="'+(i===2?11:12.5)+'" '+F+' fill="var(--ink)" font-weight="600">'+c[1]+'</text>';
    });
    h += '<text x="212" y="139" font-size="8" '+F+' fill="var(--muto)">il nostro riempimento, arrivato in fondo</text>';

    /* una delle misure che la pagina tiene di fianco alla giostra */
    h += '<text x="200" y="180" font-size="7" letter-spacing="0.6" '+F+' fill="var(--muto)">RIEMPIMENTI CONFORMI</text>';
    h += '<text x="200" y="200" font-size="16" '+F+' fill="var(--ink)" font-weight="600">74,3%</text>';
    h += '<rect x="200" y="210" width="204" height="7" fill="var(--traccia)"></rect>';
    h += '<rect x="200" y="210" width="152" height="7" fill="var(--attenz)"></rect>';
    h += '<text x="200" y="232" font-size="7.5" '+F+' fill="var(--muto)">riferimento 78,7% &#183; base delle 35 valvole</text>';

    h += '<text x="16" y="272" font-size="12" '+F+' fill="var(--muto)">il colore va solo dove serve: nove postazioni su trentacinque</text>';
    h += '<text x="16" y="290" font-size="12" '+F+' fill="var(--muto)">la nostra, la 29, sta dentro il suo normale</text>';
    return h;
  }

  var SCENE = [
    { d: function(){ return giostra(false); }, dato: 'la giostra gira · 35 rubinetti' },
    { d: function(){ return giostra(true); },  dato: 'il rubinetto 29 entra nella zona di riempimento' },
    { d: function(){ return valvola(0.62); },  dato: 'scatti in arrivo · uno scatto = 0,1 ml' },
    { d: function(){ return valvola(1); },     dato: '2505 scatti · il rubinetto si chiude' },
    { d: riga,      dato: '1980 ms · 2505 scatti · 5 in piu del bersaglio' },
    { d: albero,    dato: 'ns=2;s=Filler01.Valve29.PulseCount' },
    { d: busta,     dato: '{"cycle_id":417,"valve_id":29,…}' },
    { d: broker,    dato: 'plant/filler01/telemetry/valve' },
    { d: archivio,  dato: 'data/raw/machine=filler01/date=2026-08-22/' },
    { d: modello,   dato: 'giudizio: sana · 87%' },
    { d: schermata, dato: 'rubinetto 29 · 1980 ms · 2505 scatti · sana 87%' }
  ];

  function disegna(){
    var s = SCENE[Math.min(stato, SCENE.length-1)];
    svg.innerHTML = s.d();
    piede.textContent = s.dato;
  }

  /* ---------- quale tappa sta leggendo ---------- */
  var tappe = Array.prototype.slice.call(document.querySelectorAll('.tappa'));
  var filo = document.getElementById('filo');
  function aggiorna(){
    var meta = window.innerHeight * 0.45, nuovo = 0;
    for (var i=0;i<tappe.length;i++){
      if (tappe[i].getBoundingClientRect().top <= meta) nuovo = i;
    }
    if (nuovo !== stato){ stato = nuovo; disegna(); }
    var h = document.documentElement;
    var p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
    filo.style.width = Math.round(p*100) + '%';
  }
  window.addEventListener('scroll', aggiorna, { passive:true });
  window.addEventListener('resize', aggiorna);

  disegna();
  aggiorna();
  if (!fermo){
    setInterval(function(){
      if (stato <= 1){ ang += 2*Math.PI/35/18; disegna(); }
    }, 100);
  }
})();
</script>
