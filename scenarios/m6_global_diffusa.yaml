# Scenario deriva diffusa — instabilita pressione sull'intero serbatoio, severita massima.
#
# Perche esiste: il gate visivo della dashboard richiede sei scenari, e "deriva diffusa"
# era l'unico non coperto dalle run esistenti. Serve a verificare la regola per cui, sopra
# il 30% di valvole deviate, la dashboard smette di indicare individui e dice che la causa
# e probabilmente comune (ricetta, pressione, velocita) invece di annunciare N guasti.
#
# Rispetto a m3_global.yaml (severity 0.5, misurate 10/35 valvole deviate rispetto alla
# baseline sana con il criterio congelato in .scratch/dashboard-v6/checks/criterio.md):
# qui la severita e portata al massimo consentito. Il criterio NON e stato toccato — si
# cambia lo scenario, non la soglia, altrimenti l'acceptance perde valore
# (feedback/feedback m2-m3-m4.txt: calibration run -> criterio congelato -> acceptance run).
#
# Meccanismo: scope global, nessun valve_id ne group_id, onset abrupt. E' il caso
# diagnostico in cui NON ci sono 35 valvole rotte ma una condizione comune di processo.
scenario_id: 61
name: "deriva diffusa — instabilita pressione globale, severita massima"
seed: 42
faults:
  - fault_type: pressure_instability
    scope: global           # senza group_id ne valve_id: tocca tutte le valvole
    severity: 1.0           # (0,1]: incremento RELATIVO ampiezza driver (1+severity)
    onset:
      mode: abrupt
      start_cycle: 100
