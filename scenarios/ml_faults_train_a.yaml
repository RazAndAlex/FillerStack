# Scenario ML train A (D-W1, piano ML §3.1) — 6 fault meccanici su 6 valvole
# (restriction ×2, closing_delay ×2, opening_delay ×2), 2 severità per classe,
# onset variati (100/5000/12000, abrupt+gradual misti) per il ritardo di
# detection e contro regolarità di posizione (piano §3.1, §1.3.3).
# Severità nel pattern M2/M4: restriction (0,1] (range 0.04-0.12 demo M2),
# delay ms interi >= 1 (range 40-150 demo M2).
# seed null -> il seed del run viene da --seed (ADR-0013).
scenario_id: 60
name: "ML train A — restriction/closing_delay/opening_delay, 6 valvole"
seed: null
faults:
  - fault_type: restriction
    scope: local
    valve_id: 1
    severity: 0.04
    onset:
      mode: gradual
      start_cycle: 100
      ramp_cycles: 200
  - fault_type: restriction
    scope: local
    valve_id: 5
    severity: 0.10
    onset:
      mode: gradual
      start_cycle: 5000
      ramp_cycles: 400
  - fault_type: closing_delay
    scope: local
    valve_id: 2
    severity: 50
    onset:
      mode: gradual
      start_cycle: 100
      ramp_cycles: 200
  - fault_type: closing_delay
    scope: local
    valve_id: 6
    severity: 150
    onset:
      mode: abrupt
      start_cycle: 12000
  - fault_type: opening_delay
    scope: local
    valve_id: 3
    severity: 40
    onset:
      mode: gradual
      start_cycle: 100
      ramp_cycles: 200
  - fault_type: opening_delay
    scope: local
    valve_id: 9
    severity: 120
    onset:
      mode: abrupt
      start_cycle: 5000
