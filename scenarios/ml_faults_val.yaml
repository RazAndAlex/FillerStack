# Scenario ML validation (D-W1, piano ML §3.1) — tutti i 6 tipi di fault,
# valvole TERZE rispetto a train/test (held-out per classe), severità nel
# range train (interpolazione, §1.3.7), onset variati.
# pressure_instability su G4=[24..29] (MAI G1/G3: contengono valve8/20, ML-F4).
# Nessun overlap local+group: i local (4,7,10,11,0,31,13,21,23,32) sono tutti
# fuori da G4; valve8 e valve20 MAI portatrici.
# seed null -> il seed del run viene da --seed (ADR-0013).
