# edge mosquitto — config VERSIONATA (M8, spec §7.2; mai generata a runtime).
# POC dichiarato: plaintext su 1883, nessuna autenticazione (spec §4.2, ADR 0018).
# Hardening (auth + ACL) in M11 (roadmap §7). Line endings: LF.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
